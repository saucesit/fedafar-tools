<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compañero</title>
<link rel="manifest" href="/companero/manifest.webmanifest">
<meta name="theme-color" content="#004a99">
<link rel="icon" href="/static/companero/icon-192.png">
<link rel="apple-touch-icon" href="/static/companero/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #004a99; --primary-soft: #e6eef8;
    --bg: #f4f5f7; --card: #fff; --line: #e5e7eb;
    --text: #1a1a1a; --muted: #6b7280;
    --red: #b42318; --red-bg: #fdecea;
    --amber: #8a5300; --amber-bg: #fff4e0;
    --green: #1a6b3c; --green-bg: #e6f4ea;
    --blue: #0b4f9c; --blue-bg: #e6eef8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: 'Outfit', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
  button { font: inherit; cursor: pointer; }
  input { font: inherit; }

  .top { height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: var(--primary); color: #fff; }
  .top img { width: 28px; height: 28px; border-radius: 7px; }
  .top b { font-weight: 600; font-size: 16px; }
  .top .estado { margin-left: auto; font-size: 12px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .app { display: grid; grid-template-columns: 190px minmax(0, 1fr) minmax(0, 420px); height: calc(100% - 52px); }
  .app.sin-panel { grid-template-columns: 190px minmax(0, 1fr); }
  nav { border-right: 1px solid var(--line); background: #fafafa; padding: 10px 8px; overflow: auto; }
  nav button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; background: none; border-radius: 8px; color: #374151; text-align: left; }
  nav button:hover { background: #eef0f3; }
  nav button.on { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
  nav .cnt { margin-left: auto; font-size: 12px; color: var(--muted); }
  nav .cnt.rojo { color: var(--red); font-weight: 600; }
  nav .ic { width: 18px; text-align: center; }

  main { overflow: auto; padding: 18px 22px 40px; }
  h2 { font-size: 17px; font-weight: 600; margin: 22px 0 8px; }
  h2:first-child { margin-top: 0; }
  .metricas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .metrica { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .metrica span { color: var(--muted); font-size: 12px; }
  .metrica b { display: block; font-size: 22px; font-weight: 600; }
  .metrica b.rojo { color: var(--red); }

  .lista { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .fila { display: flex; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; align-items: flex-start; }
  .fila:last-child { border-bottom: 0; }
  .fila:hover { background: #f8fafc; }
  .fila.sel { background: var(--primary-soft); }
  .fila .cuerpo { flex: 1; min-width: 0; }
  .fila .nombre { font-weight: 600; }
  .fila .prev { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fila .lado { text-align: right; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .yo { color: var(--green); }

  .pill { font-size: 11px; padding: 2px 8px; border-radius: 6px; white-space: nowrap; display: inline-block; }
  .p-rojo { background: var(--red-bg); color: var(--red); }
  .p-ambar { background: var(--amber-bg); color: var(--amber); }
  .p-verde { background: var(--green-bg); color: var(--green); }
  .p-azul { background: var(--blue-bg); color: var(--blue); }
  .p-gris { background: #f1f2f4; color: #4b5563; }

  .aviso { background: var(--card); border: 1px dashed #cbd5e1; border-radius: 10px; padding: 14px; color: var(--muted); }
  .vacio { padding: 18px 14px; color: var(--muted); }
  .buscador { display: flex; gap: 8px; margin-bottom: 12px; }
  .buscador input { flex: 1; padding: 9px 12px; border: 1px solid #d1d5db; border-radius: 8px; }
  .buscador button, .btn { padding: 8px 14px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; }
  mark { background: #fff1a8; padding: 0 1px; }

  aside { border-left: 1px solid var(--line); background: #efeae2; display: flex; flex-direction: column; min-height: 0; }
  aside .cab { background: #fff; padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
  aside .cab b { font-weight: 600; }
  aside .cab .sub { color: var(--muted); font-size: 12px; }
  aside .cab .acc { margin-left: auto; display: flex; gap: 6px; }
  aside .cab a, aside .cab button { font-size: 12px; padding: 5px 9px; border: 1px solid #d1d5db; border-radius: 7px; background: #fff; color: var(--text); text-decoration: none; }
  .conv { flex: 1; overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
  .burb { max-width: 82%; padding: 7px 10px; border-radius: 9px; background: #fff; line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; }
  .burb.me { align-self: flex-end; background: #d9fdd3; }
  .burb .h { display: block; text-align: right; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .dia { align-self: center; font-size: 11px; background: #fff; color: var(--muted); padding: 2px 10px; border-radius: 6px; margin: 6px 0; }

  .login { max-width: 340px; margin: 12vh auto; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
  .login h1 { font-size: 18px; margin: 0 0 4px; }
  .login p { color: var(--muted); margin: 0 0 14px; }
  .login input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; margin-bottom: 10px; }
  .login button { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: var(--primary); color: #fff; font-weight: 600; }
  .err { color: var(--red); font-size: 13px; min-height: 18px; }

  /* Por aprobar */
  .sug { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  .sug .cab2 { display: flex; gap: 8px; align-items: baseline; }
  .sug .cab2 b { font-weight: 600; }
  .sug .cab2 .lado { margin-left: auto; font-size: 12px; color: var(--muted); }
  .sug .cliente { background: #f1f2f4; border-radius: 8px; padding: 7px 10px; margin: 8px 0; white-space: pre-wrap; }
  .sug textarea { width: 100%; min-height: 80px; border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px 10px; font: inherit; resize: vertical; background: #f3faf5; }
  .sug .nota { font-size: 12px; color: var(--amber); background: var(--amber-bg); border-radius: 6px; padding: 5px 8px; margin-top: 6px; }
  .sug .acc { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .sug .acc button { padding: 7px 14px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; }
  .sug .acc .enviar { background: var(--green); border-color: var(--green); color: #fff; font-weight: 600; }
  .sug .acc button:disabled { opacity: .5; }
  .banner { display: flex; align-items: center; gap: 10px; background: var(--green-bg); color: var(--green); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; cursor: pointer; font-weight: 500; }

  /* Charla */
  main.modo-charla { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
  .charla-cab { display: flex; align-items: center; gap: 10px; padding: 12px 22px; border-bottom: 1px solid var(--line); background: #fff; }
  .charla-cab b { font-size: 16px; font-weight: 600; }
  .charla-cab .sub { color: var(--muted); font-size: 12px; }
  .charla-cab button { margin-left: auto; }
  .cmsgs { flex: 1; overflow: auto; padding: 18px 22px; display: flex; flex-direction: column; gap: 10px; }
  .cm { max-width: 760px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
  .cm.yo { align-self: flex-end; background: var(--primary); color: #fff; padding: 8px 12px; border-radius: 12px 12px 2px 12px; max-width: 80%; }
  .cm.el { align-self: flex-start; background: #fff; border: 1px solid var(--line); padding: 10px 14px; border-radius: 12px 12px 12px 2px; }
  .cm.el.pensando { color: var(--muted); font-style: italic; }
  .cm.el.error { color: var(--red); }
  .borrador { margin-top: 10px; border: 1px solid #b7d7c2; background: #f3faf5; border-radius: 10px; padding: 10px; white-space: normal; }
  .borrador .para { font-size: 12px; color: var(--green); font-weight: 600; margin-bottom: 6px; }
  .borrador textarea { width: 100%; min-height: 70px; border: 1px solid #cfe3d6; border-radius: 8px; padding: 8px; font: inherit; resize: vertical; background: #fff; }
  .borrador .acc { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .borrador .acc a, .borrador .acc button { font-size: 12px; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 7px; background: #fff; color: var(--text); text-decoration: none; }
  .borrador .acc .prim { background: var(--green); border-color: var(--green); color: #fff; }
  .borrador .nota { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .sugs { display: flex; flex-wrap: wrap; gap: 8px; }
  .sugs button { padding: 7px 12px; border: 1px solid #cbd5e1; border-radius: 16px; background: #fff; }
  .compositor { display: flex; gap: 8px; padding: 10px 22px 14px; border-top: 1px solid var(--line); background: #fff; align-items: flex-end; }
  .compositor textarea { flex: 1; resize: none; min-height: 42px; max-height: 160px; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 10px; font: inherit; }
  .compositor button { height: 42px; min-width: 42px; border: 1px solid #d1d5db; border-radius: 10px; background: #fff; }
  .compositor .enviar { background: var(--primary); color: #fff; border-color: var(--primary); padding: 0 16px; }
  .compositor .mic.on { background: var(--red-bg); border-color: var(--red); }
  .compositor button:disabled { opacity: .5; cursor: default; }

  @media (max-width: 900px) {
    main.modo-charla { position: fixed; inset: 52px 0 58px 0; }
    .cmsgs { padding: 14px 16px; }
    .compositor { padding: 8px 12px; }
    .app, .app.sin-panel { grid-template-columns: minmax(0, 1fr); height: auto; }
    nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 5; display: flex; overflow-x: auto; border: 0; border-top: 1px solid var(--line); padding: 4px; background: #fff; }
    nav button { flex-direction: column; gap: 2px; font-size: 11px; padding: 6px 8px; width: auto; min-width: 68px; }
    nav .cnt { margin: 0; }
    main { padding: 14px 16px 90px; }
    .metricas { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    aside { position: fixed; inset: 52px 0 0 0; z-index: 10; }
    .top .estado { display: none; }
  }
</style>
</head>
<body>
<div class="top">
  <img src="/static/companero/icon-192.png" alt="">
  <b>Compañero</b>
  <span class="estado" id="estado"></span>
</div>

<div id="login" class="login" hidden>
  <h1>Compañero</h1>
  <p>Entrá con la contraseña del panel admin.</p>
  <form id="loginForm">
    <input type="password" id="pass" placeholder="Contraseña" autocomplete="current-password">
    <div class="err" id="loginErr"></div>
    <button type="submit">Entrar</button>
  </form>
</div>

<div id="app" class="app sin-panel" hidden>
  <nav id="nav"></nav>
  <main id="main"></main>
  <aside id="panel" hidden></aside>
</div>

<script>
const VISTAS = [
  { id: 'hoy', ic: '☀️', nombre: 'Hoy' },
  { id: 'aprobar', ic: '✅', nombre: 'Por aprobar' },
  { id: 'charla', ic: '💬', nombre: 'Charla' },
  { id: 'sin', ic: '⏳', nombre: 'Sin responder' },
  { id: 'cat:pedido', ic: '🛒', nombre: 'Pedidos' },
  { id: 'cat:reclamo', ic: '⚠️', nombre: 'Reclamos' },
  { id: 'cat:pago', ic: '💵', nombre: 'Pagos' },
  { id: 'cat:consulta', ic: '❓', nombre: 'Consultas' },
  { id: 'cat:proveedor', ic: '🚚', nombre: 'Proveedores' },
  { id: 'buscar', ic: '🔎', nombre: 'Buscar' },
];
const CAT_PILL = {
  pedido: ['Pedido', 'p-ambar'], reclamo: ['Reclamo', 'p-rojo'], pago: ['Pago', 'p-verde'],
  consulta: ['Consulta', 'p-azul'], proveedor: ['Proveedor', 'p-azul'], licitacion: ['Licitación', 'p-azul'],
  personal: ['Personal', 'p-gris'], ruido: ['Ruido', 'p-gris'],
};
let estado = { vista: 'hoy', datos: null, chatSel: null, busqueda: '', charla: [], pensando: false,
  sug: null, sugEdit: {}, sugVistas: null };
try { estado.charla = JSON.parse(localStorage.getItem('companero_charla') || '[]'); } catch (e) { estado.charla = []; }

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hora = (iso) => new Date(iso).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
const fechaCorta = (iso) => {
  const d = new Date(iso), hoy = new Date();
  if (d.toDateString() === hoy.toDateString()) return hora(iso);
  const ayer = new Date(); ayer.setDate(hoy.getDate() - 1);
  if (d.toDateString() === ayer.toDateString()) return 'ayer ' + hora(iso);
  return d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' }) + ' ' + hora(iso);
};
const espera = (min) => min < 60 ? min + ' min' : min < 1440 ? Math.floor(min / 60) + ' h ' + (min % 60) + ' min' : Math.floor(min / 1440) + ' d ' + Math.floor((min % 1440) / 60) + ' h';
const pillCat = (c) => c && CAT_PILL[c] ? `<span class="pill ${CAT_PILL[c][1]}">${CAT_PILL[c][0]}</span>` : '';
const pillPrio = (p) => p >= 3 ? '<span class="pill p-rojo">Urgente</span>' : p === 2 ? '<span class="pill p-ambar">Importante</span>' : '';

async function api(url) {
  const r = await fetch(url, { credentials: 'same-origin' });
  if (r.status === 401) { mostrarLogin(); throw new Error('no autenticado'); }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function apiPost(url, body) {
  const r = await fetch(url, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (r.status === 401) { mostrarLogin(); throw new Error('no autenticado'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

function mostrarLogin() { $('#app').hidden = true; $('#login').hidden = false; $('#pass').focus(); }

$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('#loginErr').textContent = '';
  const r = await fetch('/api/admin/login', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('#pass').value }) });
  if (!r.ok) { $('#loginErr').textContent = r.status === 429 ? 'Demasiados intentos. Esperá un minuto.' : 'Contraseña incorrecta.'; return; }
  iniciar();
});

function renderNav() {
  const d = estado.datos;
  const cnt = (v) => {
    if (v.id === 'aprobar') { const n = estado.sug ? estado.sug.pendientes.length : 0; return n ? `<span class="cnt rojo">${n}</span>` : ''; }
    if (!d) return '';
    if (v.id === 'sin') return `<span class="cnt ${d.sin_responder.length ? 'rojo' : ''}">${d.sin_responder.length}</span>`;
    if (v.id === 'hoy') return `<span class="cnt">${d.hoy.mensajes}</span>`;
    if (v.id === 'aprobar') { const n = estado.sug ? estado.sug.pendientes.length : 0; return n ? `<span class="cnt rojo">${n}</span>` : ''; }
    if (v.id.startsWith('cat:')) { const n = d.categorias_hoy[v.id.slice(4)]; return n ? `<span class="cnt">${n}</span>` : ''; }
    return '';
  };
  $('#nav').innerHTML = VISTAS.map((v) => `<button data-v="${v.id}" class="${estado.vista === v.id ? 'on' : ''}"><span class="ic">${v.ic}</span>${v.nombre}${cnt(v)}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach((b) => b.onclick = () => { estado.vista = b.dataset.v; renderNav(); renderMain(); });
}

function filaChat(c, modo) {
  const lado = modo === 'sin'
    ? `<div class="pill p-rojo">espera ${espera(c.espera_min)}</div>`
    : `${fechaCorta(c.ultimo)}<br>${c.mensajes} msj`;
  const prev = modo === 'sin' ? c.espera_preview : (c.ultimo_from_me ? '<span class="yo">FEDAFAR: </span>' : '') + esc(c.ultimo_preview);
  const cats = Object.keys(c.categorias || {}).map(pillCat).join(' ');
  return `<div class="fila ${estado.chatSel === c.chat_id ? 'sel' : ''}" data-chat="${esc(c.chat_id)}">
    <div class="cuerpo"><div class="nombre">${esc(c.nombre)} ${pillPrio(c.prioridad)} ${cats}</div>
    <div class="prev">${modo === 'sin' ? esc(prev) : prev}</div></div>
    <div class="lado">${lado}</div></div>`;
}

function filaMsg(m, resaltar) {
  let txt = esc(m.preview);
  if (resaltar) { const re = new RegExp('(' + resaltar.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'); txt = txt.replace(re, '<mark>$1</mark>'); }
  return `<div class="fila" data-chat="${esc(m.chat_id)}">
    <div class="cuerpo"><div class="nombre">${m.from_me ? '<span class="yo">FEDAFAR → </span>' : ''}${esc(m.chat_nombre || m.telefono || m.chat_id)} ${pillPrio(m.prioridad)} ${pillCat(m.categoria)} ${m.respondido ? '<span class="pill p-gris">✓ respondido</span>' : ''}</div>
    <div class="prev" style="white-space:normal">${txt}</div></div>
    <div class="lado">${fechaCorta(m.t)}</div></div>`;
}

function enlazarFilas() {
  $('#main').querySelectorAll('[data-chat]').forEach((f) => f.onclick = () => abrirChat(f.dataset.chat));
}

async function renderMain() {
  const d = estado.datos, main = $('#main');
  main.classList.toggle('modo-charla', estado.vista === 'charla');
  if (estado.vista === 'charla') return renderCharla();
  if (estado.vista === 'aprobar') return renderAprobar();
  if (!d) { main.innerHTML = '<div class="vacio">Cargando…</div>'; return; }
  const v = estado.vista;

  if (v === 'hoy') {
    const sinClasif = !d.clasificador_activo
      ? '<div class="aviso">Todavía no está activo el clasificador. Cuando lo esté, acá vas a ver primero lo urgente: reclamos, pedidos y pagos ordenados por prioridad.</div>'
      : (d.importantes.length ? '<div class="lista">' + d.importantes.map((m) => filaMsg(m)).join('') + '</div>' : '<div class="aviso">Nada urgente por ahora.</div>');
    const nSug = estado.sug ? estado.sug.pendientes.length : 0;
    main.innerHTML = (nSug ? `<div class="banner" id="irAprobar">✅ ${nSug === 1 ? 'Hay 1 respuesta sugerida' : 'Hay ' + nSug + ' respuestas sugeridas'} esperando tu OK →</div>` : '') + `
      <div class="metricas">
        <div class="metrica"><span>Mensajes hoy</span><b>${d.hoy.mensajes}</b></div>
        <div class="metrica"><span>Chats hoy</span><b>${d.hoy.chats}</b></div>
        <div class="metrica"><span>Entrantes / salientes</span><b>${d.hoy.entrantes} / ${d.hoy.salientes}</b></div>
        <div class="metrica"><span>Sin responder</span><b class="${d.sin_responder.length ? 'rojo' : ''}">${d.sin_responder.length}</b></div>
      </div>
      <h2>Lo importante</h2>${sinClasif}
      <h2>Esperando respuesta</h2>
      ${d.sin_responder.length ? '<div class="lista">' + d.sin_responder.slice(0, 5).map((c) => filaChat(c, 'sin')).join('') + '</div>' + (d.sin_responder.length > 5 ? `<p><button class="btn" id="verSin">Ver los ${d.sin_responder.length}</button></p>` : '') : '<div class="aviso">Todo respondido 👌</div>'}
      <h2>Chats de hoy</h2>
      ${d.chats_hoy.length ? '<div class="lista">' + d.chats_hoy.map((c) => filaChat(c)).join('') + '</div>' : '<div class="aviso">Hoy todavía no hubo mensajes.</div>'}`;
    const ia = $('#irAprobar'); if (ia) ia.onclick = () => { estado.vista = 'aprobar'; renderNav(); renderMain(); };
    const b = $('#verSin'); if (b) b.onclick = () => { estado.vista = 'sin'; renderNav(); renderMain(); };
  } else if (v === 'sin') {
    main.innerHTML = `<h2>Sin responder (últimos 7 días)</h2>
      <p style="color:var(--muted);margin-top:0">Chats donde el último mensaje del cliente es posterior a la última respuesta de FEDAFAR. Primero los que esperan hace más tiempo.</p>
      ${d.sin_responder.length ? '<div class="lista">' + d.sin_responder.map((c) => filaChat(c, 'sin')).join('') + '</div>' : '<div class="aviso">Todo respondido 👌</div>'}`;
  } else if (v.startsWith('cat:')) {
    const cat = v.slice(4), nom = VISTAS.find((x) => x.id === v).nombre;
    if (!d.clasificador_activo) {
      main.innerHTML = `<h2>${nom}</h2><div class="aviso">Esta sección se llena cuando activemos el clasificador: va a separar solo los ${nom.toLowerCase()} de todo lo que entra por WhatsApp.</div>`;
    } else {
      main.innerHTML = `<h2>${nom} (últimos 7 días)</h2><div class="vacio">Cargando…</div>`;
      const r = await api('/api/companero/categoria?c=' + encodeURIComponent(cat));
      if (estado.vista !== v) return;
      main.innerHTML = `<h2>${nom} (últimos 7 días)</h2>` + (r.mensajes.length ? '<div class="lista">' + r.mensajes.map((m) => filaMsg(m)).join('') + '</div>' : '<div class="aviso">No hay mensajes en esta categoría.</div>');
    }
  } else if (v === 'buscar') {
    main.innerHTML = `<h2>Buscar</h2>
      <form class="buscador" id="fBuscar"><input id="q" placeholder="Densulin, recibo, Farmacia Güemes…" value="${esc(estado.busqueda)}"><button>Buscar</button></form>
      <div id="resBuscar"></div>`;
    $('#fBuscar').onsubmit = async (e) => {
      e.preventDefault();
      estado.busqueda = $('#q').value.trim();
      if (estado.busqueda.length < 2) return;
      $('#resBuscar').innerHTML = '<div class="vacio">Buscando…</div>';
      const r = await api('/api/companero/buscar?q=' + encodeURIComponent(estado.busqueda));
      $('#resBuscar').innerHTML = r.mensajes.length
        ? `<p style="color:var(--muted)">${r.mensajes.length} mensajes${r.mensajes.length === 150 ? ' (mostrando los 150 más recientes)' : ''}</p><div class="lista">` + r.mensajes.map((m) => filaMsg(m, estado.busqueda)).join('') + '</div>'
        : '<div class="aviso">Sin resultados.</div>';
      enlazarFilas();
    };
    $('#q').focus();
    if (estado.busqueda) $('#fBuscar').requestSubmit();
  }
  enlazarFilas();
}

async function abrirChat(chatId) {
  estado.chatSel = chatId;
  const panel = $('#panel');
  panel.hidden = false;
  $('#app').classList.remove('sin-panel');
  $('#main').querySelectorAll('.fila').forEach((f) => f.classList.toggle('sel', f.dataset.chat === chatId));
  panel.innerHTML = '<div class="cab"><b>Cargando…</b></div>';
  const r = await api('/api/companero/chat?id=' + encodeURIComponent(chatId));
  if (estado.chatSel !== chatId) return;
  const ms = r.mensajes, m0 = ms[ms.length - 1] || {};
  const nombre = m0.chat_nombre || m0.telefono || chatId;
  const tel = (ms.find((m) => m.telefono) || {}).telefono;
  const digitos = tel ? tel.split('@')[0].replace(/\D/g, '') : '';
  let html = '', diaAnt = '';
  ms.forEach((m) => {
    const dia = new Date(m.t).toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
    if (dia !== diaAnt) { html += `<div class="dia">${esc(dia)}</div>`; diaAnt = dia; }
    html += `<div class="burb ${m.from_me ? 'me' : ''}">${pillPrio(m.prioridad)} ${pillCat(m.categoria)} ${esc(m.preview)}<span class="h">${hora(m.t)}</span></div>`;
  });
  panel.innerHTML = `<div class="cab"><div><b>${esc(nombre)}</b><div class="sub">${digitos ? '+' + digitos : ''} · ${ms.length} mensajes guardados</div></div>
    <div class="acc"><button id="responderChat">✍️ Responder</button>${digitos ? `<a href="https://wa.me/${digitos}" target="_blank" rel="noopener">Abrir en WhatsApp</a>` : ''}<button id="cerrarChat">✕</button></div></div>
    <div class="conv" id="conv">${html || '<div class="vacio">Sin mensajes.</div>'}</div>`;
  $('#cerrarChat').onclick = () => { estado.chatSel = null; panel.hidden = true; $('#app').classList.add('sin-panel'); $('#main').querySelectorAll('.fila').forEach((f) => f.classList.remove('sel')); };
  $('#responderChat').onclick = () => {
    if (window.innerWidth <= 900) $('#cerrarChat').click();
    estado.vista = 'charla'; renderNav(); renderMain();
    enviarCharla(`Redactá una respuesta para ${nombre}.`, chatId);
  };
  const conv = $('#conv'); conv.scrollTop = conv.scrollHeight;
}

// ── Por aprobar: respuestas sugeridas ────────────────────────────────────
const ESTADO_SUG = {
  enviada: ['✓ Enviada', 'p-verde'], aprobada: ['Aprobada · esperando a WhatsApp Web', 'p-ambar'],
  enviando: ['Enviando…', 'p-ambar'], error: ['Error al enviar', 'p-rojo'], vencida: ['Venció sin enviarse', 'p-rojo'],
  descartada: ['Descartada', 'p-gris'], respondida: ['La contestó el equipo', 'p-gris'],
  reemplazada: ['Reemplazada por otra', 'p-gris'], sin_sugerencia: ['Sin sugerencia', 'p-gris'],
};
const hace = (iso) => espera(Math.max(0, Math.floor((Date.now() - new Date(iso)) / 60000)));

function renderAprobar() {
  const main = $('#main'), d = estado.sug;
  if (!d) { main.innerHTML = '<h2>Por aprobar</h2><div class="vacio">Cargando…</div>'; return; }
  const avisos = ('Notification' in window) && Notification.permission !== 'granted'
    ? '<p><button class="btn" id="activarAvisos">🔔 Activar avisos en esta PC</button></p>' : '';
  const tarjetas = d.pendientes.map((x) => `<div class="sug" data-sid="${x.id}">
      <div class="cab2"><b>${esc(x.chat_nombre || x.chat_id)}</b><span class="lado">hace ${hace(x.creado_en)}</span></div>
      <div class="cliente">${esc(x.texto_cliente || '')}</div>
      <textarea data-sugt="${x.id}">${esc(estado.sugEdit[x.id] ?? x.sugerencia ?? '')}</textarea>
      ${x.nota && !/^ok\.?$/i.test(x.nota.trim()) ? `<div class="nota">💬 ${esc(x.nota)}</div>` : ''}
      <div class="acc"><button class="enviar" data-aprobar="${x.id}">Enviar</button>
        <button data-descartar="${x.id}">Descartar</button>
        <button data-verchat="${esc(x.chat_id)}">Ver chat</button></div></div>`).join('');
  const rec = d.recientes.filter((x) => x.estado !== 'reemplazada').map((x) => {
    const e = ESTADO_SUG[x.estado] || [x.estado, 'p-gris'];
    const det = x.estado === 'error' ? x.error : x.estado === 'sin_sugerencia' ? x.nota : (x.texto_final || x.sugerencia);
    return `<div class="fila" data-chat="${esc(x.chat_id)}"><div class="cuerpo"><div class="nombre">${esc(x.chat_nombre || x.chat_id)} <span class="pill ${e[1]}">${e[0]}</span></div>
      <div class="prev" style="white-space:normal">${esc(det || '')}</div></div><div class="lado">${fechaCorta(x.enviado_en || x.aprobado_en || x.creado_en)}</div></div>`;
  }).join('');
  main.innerHTML = `<h2>Por aprobar</h2>
    <p style="color:var(--muted);margin-top:0">Cuando entra un mensaje que pide respuesta, el Compañero te deja una. Corregila si hace falta y tocá Enviar: sale desde el WhatsApp Web de esta PC en unos segundos. Sin tu OK no sale nada.</p>
    ${avisos}
    ${tarjetas || '<div class="aviso">No hay respuestas esperando tu OK.</div>'}
    <h2>Últimas 24 h</h2>${rec ? '<div class="lista">' + rec + '</div>' : '<div class="aviso">Nada todavía.</div>'}`;
  const av = $('#activarAvisos'); if (av) av.onclick = () => Notification.requestPermission().then(renderAprobar);
  main.querySelectorAll('textarea[data-sugt]').forEach((t) => t.oninput = () => { estado.sugEdit[t.dataset.sugt] = t.value; });
  main.querySelectorAll('[data-verchat]').forEach((b) => b.onclick = () => abrirChat(b.dataset.verchat));
  main.querySelectorAll('[data-descartar]').forEach((b) => b.onclick = async () => {
    b.disabled = true;
    await apiPost(`/api/companero/sugerencias/${b.dataset.descartar}/descartar`, {}).catch(() => {});
    delete estado.sugEdit[b.dataset.descartar]; await cargarSug(true);
  });
  main.querySelectorAll('[data-aprobar]').forEach((b) => b.onclick = async () => {
    const id = b.dataset.aprobar, texto = main.querySelector(`textarea[data-sugt="${id}"]`).value.trim();
    b.disabled = true;
    const aprobar = (forzar) => apiPost(`/api/companero/sugerencias/${id}/aprobar`, { texto, forzar });
    try {
      try { await aprobar(false); }
      catch (e) {
        if (!/ya le contestó/.test(e.message)) throw e;
        if (!confirm('Alguien del equipo ya le contestó a este chat. ¿Enviar igual?')) { b.disabled = false; return; }
        await aprobar(true);
      }
      delete estado.sugEdit[id]; await cargarSug(true);
    } catch (e) { alert(e.message); b.disabled = false; }
  });
  enlazarFilas();
}

async function cargarSug(forzarRender) {
  try {
    estado.sug = await api('/api/companero/sugerencias');
  } catch (e) { return; }
  const ids = estado.sug.pendientes.map((x) => x.id);
  if (estado.sugVistas === null) estado.sugVistas = new Set(ids);     // al abrir no avisa lo que ya estaba
  const nuevas = estado.sug.pendientes.filter((x) => !estado.sugVistas.has(x.id));
  nuevas.forEach((x) => {
    estado.sugVistas.add(x.id);
    if ('Notification' in window && Notification.permission === 'granted') {
      const n = new Notification('Compañero · ' + (x.chat_nombre || 'cliente'), { body: (x.texto_cliente || '') + '\n→ ' + (x.sugerencia || ''), icon: '/static/companero/icon-192.png', tag: 'sug-' + x.id });
      n.onclick = () => { window.focus(); estado.vista = 'aprobar'; renderNav(); renderMain(); n.close(); };
    }
  });
  document.title = ids.length ? `(${ids.length}) Compañero` : 'Compañero';
  renderNav();
  const escribiendo = document.activeElement && document.activeElement.matches('textarea[data-sugt]');
  if (estado.vista === 'aprobar' && (forzarRender || !escribiendo)) renderAprobar();
  if (estado.vista === 'hoy' && nuevas.length) renderMain();
}

// ── Charla con el Compañero ──────────────────────────────────────────────
const SUGERENCIAS = ['¿Qué quedó sin responder?', 'Resumime el día', '¿Qué pedidos entraron hoy?', '¿Hubo algún reclamo esta semana?'];

function guardarCharla() {
  try { localStorage.setItem('companero_charla', JSON.stringify(estado.charla.slice(-40))); } catch (e) {}
}

function formato(t) {
  return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/^- /gm, '• ');
}

function tarjetaBorrador(b, i, j) {
  const dig = b.telefono ? String(b.telefono).split('@')[0].replace(/\D/g, '') : '';
  return `<div class="borrador"><div class="para">✍️ Borrador para ${esc(b.nombre)}${dig ? ' · +' + dig : ''}</div>
    <textarea data-b="${i}-${j}">${esc(b.texto)}</textarea>
    <div class="acc">
      ${b.enviado ? '<span class="pill p-verde">✓ Aprobado para enviar</span>' : `<button class="prim" data-enviarb="${i}-${j}">Enviar</button>`}
      <button data-copiar="${i}-${j}">Copiar</button>
      ${dig ? `<a href="#" data-wa="${i}-${j}" data-dig="${dig}">Abrir en WhatsApp con el texto</a>` : ''}
      <button data-verchat="${esc(b.chat_id)}">Ver chat</button>
    </div>
    <div class="nota">Solo sale si tocás Enviar. "Abrir en WhatsApp" abre otra pestaña de WhatsApp Web (la anterior queda en "Usar aquí").</div></div>`;
}

function renderCharla() {
  const main = $('#main');
  const msgs = estado.charla.map((m, i) => m.role === 'user'
    ? `<div class="cm yo">${esc(m.content)}</div>`
    : `<div class="cm el ${m.error ? 'error' : ''}">${formato(m.content)}${(m.borradores || []).map((b, j) => tarjetaBorrador(b, i, j)).join('')}</div>`).join('');
  const vacio = `<div class="cm el">Hola Facu. Preguntame lo que pasó en el WhatsApp o pedime que le responda a alguien: te dejo el borrador y lo mandás vos.</div>
    <div class="sugs">${SUGERENCIAS.map((s) => `<button data-sug="${esc(s)}">${esc(s)}</button>`).join('')}</div>`;
  const hayMic = 'webkitSpeechRecognition' in window || 'SpeechRecognition' in window;
  main.innerHTML = `<div class="charla-cab"><div><b>Charla</b><div class="sub">Lee los chats y la lista de precios de la app. Nunca envía nada por WhatsApp.</div></div>
      ${estado.charla.length ? '<button class="btn" id="nuevaCharla">Nueva charla</button>' : ''}</div>
    <div class="cmsgs" id="cmsgs">${msgs || vacio}${estado.pensando ? '<div class="cm el pensando">Revisando los chats…</div>' : ''}</div>
    <form class="compositor" id="fCharla">
      <textarea id="cTexto" rows="1" placeholder="Escribile al Compañero… (Enter envía, Shift+Enter salto de línea)"></textarea>
      ${hayMic ? '<button type="button" class="mic" id="cMic" title="Hablar">🎤</button>' : ''}
      <button class="enviar" ${estado.pensando ? 'disabled' : ''}>Enviar</button>
    </form>`;
  const cm = $('#cmsgs'); cm.scrollTop = cm.scrollHeight;
  const ta = $('#cTexto');
  ta.oninput = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 160) + 'px'; };
  ta.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#fCharla').requestSubmit(); } };
  $('#fCharla').onsubmit = (e) => { e.preventDefault(); const t = ta.value.trim(); if (t && !estado.pensando) enviarCharla(t, estado.chatSel); };
  if (window.innerWidth > 900) ta.focus();
  const nc = $('#nuevaCharla'); if (nc) nc.onclick = () => { if (estado.pensando) return; estado.charla = []; guardarCharla(); renderCharla(); };
  main.querySelectorAll('[data-sug]').forEach((b) => b.onclick = () => enviarCharla(b.dataset.sug, estado.chatSel));
  main.querySelectorAll('[data-verchat]').forEach((b) => b.onclick = () => abrirChat(b.dataset.verchat));
  main.querySelectorAll('textarea[data-b]').forEach((t) => t.oninput = () => {
    const [i, j] = t.dataset.b.split('-').map(Number);
    estado.charla[i].borradores[j].texto = t.value; guardarCharla();
  });
  main.querySelectorAll('[data-enviarb]').forEach((b) => b.onclick = async () => {
    const [i, j] = b.dataset.enviarb.split('-').map(Number);
    const bo = estado.charla[i].borradores[j];
    const t = main.querySelector(`textarea[data-b="${b.dataset.enviarb}"]`).value.trim();
    if (!confirm(`¿Enviar a ${bo.nombre}?\n\n${t}`)) return;
    b.disabled = true;
    try {
      await apiPost('/api/companero/enviar', { chat_id: bo.chat_id, texto: t });
      bo.texto = t; bo.enviado = true; guardarCharla(); renderCharla(); cargarSug();
    } catch (e) { alert(e.message); b.disabled = false; }
  });
  main.querySelectorAll('[data-copiar]').forEach((b) => b.onclick = async () => {
    const t = main.querySelector(`textarea[data-b="${b.dataset.copiar}"]`);
    try { await navigator.clipboard.writeText(t.value); } catch (e) { t.select(); document.execCommand('copy'); }
    b.textContent = '✓ Copiado'; setTimeout(() => b.textContent = 'Copiar', 1500);
  });
  main.querySelectorAll('[data-wa]').forEach((a) => a.onclick = (e) => {
    e.preventDefault();
    const t = main.querySelector(`textarea[data-b="${a.dataset.wa}"]`);
    window.open(`https://wa.me/${a.dataset.dig}?text=${encodeURIComponent(t.value)}`, '_blank', 'noopener');
  });
  const mic = $('#cMic');
  if (mic) mic.onclick = () => dictar(mic, ta);
}

let _rec = null;
function dictar(btn, ta) {
  if (_rec) { _rec.stop(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  _rec = new SR(); _rec.lang = 'es-AR'; _rec.interimResults = true; _rec.continuous = true;
  const base = ta.value ? ta.value.trim() + ' ' : '';
  _rec.onresult = (e) => { ta.value = base + Array.from(e.results).map((r) => r[0].transcript).join(''); ta.oninput(); };
  _rec.onend = () => { _rec = null; btn.classList.remove('on'); ta.focus(); };
  _rec.onerror = () => { _rec = null; btn.classList.remove('on'); };
  btn.classList.add('on'); _rec.start();
}

async function enviarCharla(texto, foco) {
  if (estado.pensando) return;
  estado.charla.push({ role: 'user', content: texto });
  estado.pensando = true; guardarCharla();
  if (estado.vista === 'charla') renderCharla();
  // al servidor solo va texto; los borradores viajan como nota para que recuerde qué redactó
  const historial = estado.charla.filter((m) => !m.error).map((m) => ({
    role: m.role,
    content: m.content + (m.borradores || []).map((b) => `\n[Borrador para ${b.nombre} (chat ${b.chat_id}): ${b.texto}]`).join(''),
  }));
  try {
    const r = await apiPost('/api/companero/charla', { historial, foco: foco || null });
    estado.charla.push({ role: 'assistant', content: r.texto || '(sin respuesta)', borradores: r.borradores || [] });
  } catch (e) {
    if (e.message === 'no autenticado') { estado.charla.pop(); }
    else estado.charla.push({ role: 'assistant', content: 'No pude responder: ' + e.message, error: true });
  }
  estado.pensando = false; guardarCharla();
  if (estado.vista === 'charla') renderCharla();
}

async function cargar() {
  try {
    estado.datos = await api('/api/companero/resumen');
    const u = estado.datos.ultimo_mensaje;
    $('#estado').textContent = (u ? 'Último mensaje recibido: ' + fechaCorta(u) + ' · actualizado ' + hora(new Date().toISOString()) : 'Todavía no hay mensajes guardados')
      + (estado.datos.sin_clasificar ? ' · clasificando ' + estado.datos.sin_clasificar + '…' : '');
    renderNav();
    if (!['buscar', 'charla', 'aprobar'].includes(estado.vista)) renderMain();
  } catch (e) {
    if (e.message !== 'no autenticado') $('#estado').textContent = 'No se pudo actualizar (' + e.message + ')';
  }
}

async function iniciar() {
  const me = await fetch('/api/admin/me', { credentials: 'same-origin' }).then((r) => r.json()).catch(() => ({}));
  if (!me.authenticated) return mostrarLogin();
  $('#login').hidden = true;
  $('#app').hidden = false;
  renderNav(); renderMain();
  await cargar();
  cargarSug();
  if (!window._timer) { window._timer = setInterval(cargar, 60000); setInterval(cargarSug, 20000); }
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/companero/sw.js', { scope: '/companero/' }).catch(() => {});
iniciar();
</script>
